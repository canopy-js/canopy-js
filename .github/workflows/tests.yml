name: Tests
on:
  workflow_call:
    outputs:
      done:
        description: "Signal that all tests are complete"
        value: ${{ jobs.all-tests.outputs.done }}

jobs:
  jest:
    name: Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
      - id: cache-key
        run: echo "key=playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npm run build-prod
      - run: npm install -g .
      - run: npx playwright install --with-deps
      - run: npm run jest

  playwright-tests:
    name: Playwright (${{ matrix.target.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: nav
            cmd: npx playwright test playwright/navigation.spec.js
          - id: style
            cmd: npx playwright test playwright/style.spec.js
          - id: rest
            cmd: npx playwright test $(find ./playwright -name '*.spec.js' ! -name 'navigation.spec.js' ! -name 'style.spec.js')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
      - id: cache-key
        run: echo "key=playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npm run build-prod
      - run: npm install -g .
      - name: Install Times New Roman font
        run: sudo apt-get update && sudo apt-get install -y ttf-mscorefonts-installer && sudo fc-cache -f
      - run: npx playwright install --with-deps
      - run: ${{ matrix.target.cmd }} --max-failures=1
      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.target.id }}
          path: test-results/
          if-no-files-found: ignore

      - name: Upload playwright-report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.target.id }}
          path: playwright-report/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run lint

  all-tests:
    name: All Tests Complete
    runs-on: ubuntu-latest
    needs: [jest, playwright-tests, lint]
    if: always()
    outputs:
      done: true
    steps:
      - run: echo "All tests complete"
