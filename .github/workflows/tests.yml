name: Tests
on:
  workflow_call:
    outputs:
      done:
        description: "Signal that all tests are complete"
        value: ${{ jobs.all-tests.outputs.done }}

jobs:
  jest:
    name: Jest Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
      - id: cache-key
        run: echo "key=playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npm run build-prod
      - run: npm install -g .
      - run: npx playwright install --with-deps
      - run: npm run jest

  playwright-tests:
    name: Playwright (${{ matrix.target.id }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - id: nav
            cmd: npx playwright test playwright/navigation.spec.js
          - id: style
            cmd: npx playwright test playwright/style.spec.js
          - id: rest
            cmd: npx playwright test $(find ./playwright -name '*.spec.js' ! -name 'navigation.spec.js' ! -name 'style.spec.js')
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
      - id: cache-key
        run: echo "key=playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT
      - uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.cache-key.outputs.key }}
          restore-keys: |
            playwright-${{ runner.os }}-
      - run: npm ci
      - run: npm run build-prod
      - run: npm install -g .
      - name: Install Times New Roman font
        run: sudo apt-get update && sudo apt-get install -y ttf-mscorefonts-installer && sudo fc-cache -f
      - run: npx playwright install --with-deps
      - run: ${{ matrix.target.cmd }} --max-failures=1
      - name: Upload test-results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.target.id }}
          path: test-results/
          if-no-files-found: ignore

      - name: Upload playwright-report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report-${{ matrix.target.id }}
          path: playwright-report/
          if-no-files-found: ignore

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run lint

  electron-portable:
    name: Electron portable (${{ matrix.id }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: windows-x64
            os: windows-latest
            artifact: United States.exe
          - id: linux-x64
            os: ubuntu-latest
            artifact: United States.AppImage
          - id: macos
            os: macos-latest
            artifact: United States.app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20.x'
      - run: npm ci
      - run: npm run build-prod
      - run: npm install -g .
      - name: Build portable application
        working-directory: playwright/test_project
        run: canopy electron --portable
      - name: Verify portable artifact
        shell: pwsh
        run: |
          $artifact = Get-ChildItem 'playwright/test_project/build/electron/out' -Recurse |
            Where-Object { $_.Name -eq '${{ matrix.artifact }}' } |
            Select-Object -First 1
          if (-not $artifact) {
            throw "Expected portable artifact was not created: ${{ matrix.artifact }}"
          }
      - uses: actions/upload-artifact@v6
        with:
          name: canopy-electron-portable-${{ matrix.id }}
          path: playwright/test_project/build/electron/out/**/${{ matrix.artifact }}
          if-no-files-found: error

  all-tests:
    name: All Tests Complete
    runs-on: ubuntu-latest
    needs: [jest, playwright-tests, lint, electron-portable]
    if: always()
    outputs:
      done: true
    steps:
      - run: echo "All tests complete"
