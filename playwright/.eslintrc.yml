env:
  browser: true
  node: true
  commonjs: true
  es2021: true
extends: eslint:recommended
overrides: []
parserOptions:
  ecmaVersion: latest
  sourceType: module
ignorePatterns:
  - '**/build/**'
  - '**/root/**'
  - 'prefix_test/**'
  - 'hash_urls_test/**'
  - 'hash_urls_and_prefix_test/**'
  - 'hash_urls_and_prefix_static_test/**'
rules:
  no-prototype-builtins: off
  no-unused-vars:
    - error
    -
      argsIgnorePattern: ^_
      varsIgnorePattern: ^_
  no-misleading-character-class: off
